<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" fill="none" role="img" aria-label="Let&#x27;s build."><style>
.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Helvetica,Arial,sans-serif}
.up{opacity:0;animation:up .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fade{opacity:0;animation:fade 1s ease forwards}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important}}
</style>
<defs><clipPath id="c"><rect width="1200" height="240" rx="20"/></clipPath>
  <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" x2="420" y1="0" y2="0">
    <stop offset="0" stop-color="#c8ff3c" stop-opacity="0"/><stop offset=".5" stop-color="#c8ff3c"/><stop offset="1" stop-color="#c8ff3c" stop-opacity="0"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-420 0;1200 0" dur="4s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#f7f8f8" fill-opacity=".06"/></pattern>
</defs>
<rect x=".5" y=".5" width="1199" height="239" rx="20" fill="#08090a" stroke="#1d1f23"/>
<g clip-path="url(#c)">
  <rect width="1200" height="240" fill="url(#dots)"/>
  <text x="600.0" y="140" text-anchor="middle" class="s" font-size="104" font-weight="800" letter-spacing="-4" stroke="#1d1f23" stroke-width="1.2">let's build.</text>
  <text x="600.0" y="140" text-anchor="middle" class="s" font-size="104" font-weight="800" letter-spacing="-4" stroke="url(#g)" stroke-width="1.4">let's build.</text>
  <text x="600.0" y="196" text-anchor="middle" class="m" font-size="13" fill="#4b4f57">thanks for scrolling — open to collaborations, freelance &amp; full-time roles</text>
</g></svg>
