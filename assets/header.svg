    <circle cx="968" cy="200" r="26" stroke="#c8ff3c" fill="none"><animate attributeName="r" values="26;110" dur="3.6s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;0" dur="3.6s" begin="0s" repeatCount="indefinite"/></circle><circle cx="968" cy="200" r="26" stroke="#c8ff3c" fill="none"><animate attributeName="r" values="26;110" dur="3.6s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></circle><circle cx="968" cy="200" r="26" stroke="#c8ff3c" fill="none"><animate attributeName="r" values="26;110" dur="3.6s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;0" dur="3.6s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="968" cy="200" r="26" fill="#c8ff3c"/>
    <text x="968" y="205" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#08090a">&lt;/&gt;</text>
    <g class="spin"><circle cx="968" cy="200" r="44" stroke="#c8ff3c" stroke-opacity=".35" stroke-dasharray="1 9" stroke-linecap="round"/></g>
