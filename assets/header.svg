<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-label="Harshil Brahmani — I build fast interfaces &amp; AI agents that ship."><style>
.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Helvetica,Arial,sans-serif}
.up{opacity:0;animation:up .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fade{opacity:0;animation:fade 1s ease forwards}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important}}

.name{fill:#f7f8f8;fill-opacity:0;stroke:#f7f8f8;stroke-width:1.1;stroke-dasharray:420;stroke-dashoffset:420;
  animation:draw 2.4s cubic-bezier(.65,0,.35,1) .3s forwards,fill 1.1s ease 2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fill{to{fill-opacity:1;stroke-opacity:0}}
.spin{transform-origin:968px 200px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<defs>
  <clipPath id="c"><rect width="1200" height="420" rx="20"/></clipPath>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#f7f8f8" fill-opacity=".09"/></pattern>
  <pattern id="lit" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#c8ff3c"/></pattern>
  <linearGradient id="beamG"><stop offset="0" stop-color="#000"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
  <mask id="beam"><rect y="0" width="320" height="420" fill="url(#beamG)">
    <animate attributeName="x" values="-320;1200" dur="7s" repeatCount="indefinite"/></rect></mask>
  <radialGradient id="vigG" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="vig"><rect width="1200" height="420" fill="url(#vigG)"/></mask>
  <radialGradient id="glow"><stop offset="0" stop-color="#c8ff3c" stop-opacity=".22"/><stop offset="1" stop-color="#c8ff3c" stop-opacity="0"/></radialGradient>
  <linearGradient id="lineG"><stop offset="0" stop-color="#c8ff3c" stop-opacity="0"/><stop offset=".5" stop-color="#c8ff3c"/><stop offset="1" stop-color="#c8ff3c" stop-opacity="0"/></linearGradient>
</defs>
<rect x=".5" y=".5" width="1199" height="419" rx="20" fill="#08090a" stroke="#1d1f23"/>
