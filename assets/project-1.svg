<svg xmlns="http://www.w3.org/2000/svg" width="580" height="230" viewBox="0 0 580 230" fill="none" role="img" aria-label="Rivee — voice agent: A real-estate voice agent that talks in natural Hinglish and remembers context. Whisper → GPT-4o-mini → ElevenLabs."><style>
.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Helvetica,Arial,sans-serif}
.up{opacity:0;animation:up .9s cubic-bezier(.16,1,.3,1) forwards}
