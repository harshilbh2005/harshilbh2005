<svg xmlns="http://www.w3.org/2000/svg" width="580" height="230" viewBox="0 0 580 230" fill="none" role="img" aria-label="Hinglish Compiler: A compiler for a Hinglish programming language: Flex lexer, Bison parser, three-address code."><style>
.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Helvetica,Arial,sans-serif}
.up{opacity:0;animation:up .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fade{opacity:0;animation:fade 1s ease forwards}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important}}

.beam{stroke-dasharray:9 91;animation:beam 5s linear infinite;animation-delay:-3.75s}
@keyframes beam{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
</style>
<defs><filter id="b" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter></defs>
<rect x=".5" y=".5" width="579" height="229" rx="16" fill="#0c0d0f" stroke="#1d1f23"/>
